instructions-dir: "${system-temp}/vector/instructions"
agents:
  claude:
    type: cli
    command: claude '<instruction>'
  antigravity:
    type: cli
    command: agy -i '<instruction>'
  codex:
    type: cli
    command: codex '<instruction>'
  opencode:
    type: cli
    command: opencode --prompt '<instruction>'
profiles:
  create-doc: [antigravity, claude, codex]
  code: [antigravity, claude, codex, opencode]
