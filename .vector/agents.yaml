instructions-dir: "${system-temp}/vector/instructions"

# Optional: override the launch prompt sent to the agent when a Vector action is triggered.
# The <instruction-id> placeholder is replaced with the UUID of the generated instruction file.
# When this field is absent the built-in default is used:
#   process the instruction <instruction-id> by using the vector mcp
#
# Example:
#   prompt: 'process the instruction <instruction-id> by using the vector mcp'

agents:
  claude:
    type: cli
    command: claude '<instruction>'
  opus:
    type: cli
    command: claude --model claude-opus-5-5 '<instruction>'
  sol:
    type: cli
    command: codex --model gpt-6-sol '<instruction>'
  codex:
    type: cli
    command: codex --model gpt-6-sol '<instruction>'
  antigravity:
    type: cli
    command: agy -i '<instruction>'
  opencode:
    type: cli
    command: opencode --prompt '<instruction>'
profiles:
  create-doc: [antigravity, claude, opus, sol, codex]
  discuss-doc: [antigravity, claude, opus, sol, codex, opencode]
  code: [antigravity, claude, sol, opus, codex, opencode]
